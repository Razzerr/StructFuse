_target_: src.models.contact_lit_module.ContactLitModule

# retrieval (go straight into module __init__)
index_dir: data/index_t33
topk: 4
only_positive_transfer: false
min_seq_sep: ${data.min_seq_sep}

# esm model hyperparams
esm_model: esm2_t33_650M_UR50D
finetune_esm: false
d_esm: 1280

# align scoring
use_blosum: true

# contact prediction head
d_pair: 128
width: 128
depth: 8
rank: 32

# head architecture
head_type: "axial"    # "cnn", "dilated", or "axial" - dilated for larger receptive field
head_num_heads: 4       # number of query attention heads if head_type="axial"
head_num_kv_heads: 1    # GQA: 1 KV heads shared across 4 query heads
alternating_axial: true # even blocks=row, odd blocks=col (halves SDPA calls)
use_checkpoint: false    # gradient checkpointing on axial attention blocks (saves ~12-18 GB VRAM)

# fusion strategy
fusion_strategy: "trufor"
fusion_num_heads: 4
fusion_reduction: 1

# optim (handled by module.configure_optimizers)
lr: 5.0e-4
wd: 1.0e-2

# loss hyperparameters
pos_weight_scale: 1.0 
label_smoothing: 0.1

# Tversky loss (optional regularizer for F1 optimization)
use_tversky: true          # Enable Tversky loss as regularizer
tversky_weight: 0.5        # Weight for Tversky regularizer (loss = BCE + 0.3*Tversky)
tversky_alpha: 0.3         # False positive penalty weight
tversky_beta: 0.7          # False negative penalty weight (beta < alpha = recall-biased)
tversky_gamma: 1.0         # Focal modulation strength

max_tpl_cache: 1000

warmup_steps: 0          # 0 → use warmup_fraction
warmup_fraction: 0.02    # 2% of total scheduled steps
min_lr_ratio: 0.1
compile_model: true