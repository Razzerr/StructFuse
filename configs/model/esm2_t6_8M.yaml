_target_: src.models.contact_lit_module.ContactLitModule

# Defaults reflect the Stage 3 frontier_8M architecture so experiment configs
# only need to override what changes (e.g. ablations). frontier_8M.yaml
# becomes a thin wrapper (task_name + seed + paths).

# retrieval params — passed-through to internal _prior_builder fallback
# (used by TemplateOnlyLitModule.forward; main path uses DataModule).
# Override via data.topk / data.random_retrieval for paper runs.
index_dir: data/index_t6
topk: 4
only_positive_transfer: false
min_seq_sep: ${data.min_seq_sep}
min_template_similarity: 0.0
random_retrieval: false

# esm model hyperparams
esm_model: esm2_t6_8M_UR50D
finetune_esm: false
d_esm: 320

# align scoring
use_blosum: true

# contact prediction head — frontier shape
d_pair: 128
width: 128
depth: 8
rank: 32

# head architecture — axial + triangle multiplicative updates
head_type: "axial_tri"
head_num_heads: 4
head_num_kv_heads: 1            # GQA
alternating_axial: true
use_checkpoint: false           # 8M has memory headroom, skip checkpointing
triangle_c: 32

# fusion strategy — grouped per-feature encoders + zero-init residual
fusion_strategy: "grouped"
fusion_num_heads: 4             # unused for grouped, kept for non-grouped overrides
fusion_reduction: 1
fusion_feature_groups:
  tpl_contact: 2
  tpl_dist: 9

# Stage 2 feature flags
use_tpl_dist_bins: true

# optim
lr: 3.0e-4
wd: 1.0e-2
warmup_steps: 0                 # 0 → fall back to warmup_fraction
warmup_fraction: 0.05
min_lr_ratio: 0.1

# loss hyperparameters
pos_weight_scale: 1.0
label_smoothing: 0.1

# Tversky loss
use_tversky: true
tversky_weight: 0.5
tversky_alpha: 0.3
tversky_beta: 0.7
tversky_gamma: 1.0

max_tpl_cache: 1000

# torch.compile fails on triangle path (see esm2_t33_650M.yaml comment)
compile_model: false
