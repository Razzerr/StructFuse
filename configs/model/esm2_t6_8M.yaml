_target_: src.models.contact_lit_module.ContactLitModule

# retrieval (go straight into module __init__)
index_dir: data/index_t6
topk: 4
only_positive_transfer: false
min_seq_sep: ${data.min_seq_sep}

# esm model hyperparams
esm_model: esm2_t6_8M_UR50D
finetune_esm: false
d_esm: 320

# align scoring
use_blosum: true

# contact prediction head
d_pair: 128
width: 128
depth: 8
rank: 32

# head architecture
head_type: "axial"    # "cnn", "dilated", or "axial" - dilated for larger receptive field
head_num_heads: 4       # number of query attention heads if head_type="axial"
head_num_kv_heads: 1    # GQA: 1 KV head shared across 4 query heads
alternating_axial: true # even blocks=row, odd blocks=col (halves SDPA calls)
use_checkpoint: false   # not needed for 8M model, saves ~2x compute vs checkpointing

# fusion strategy
fusion_strategy: "trufor"
fusion_num_heads: 4
fusion_reduction: 1

# optim (handled by module.configure_optimizers)
lr: 5.0e-4
wd: 1.0e-2

# loss hyperparameters
pos_weight_scale: 1.0 
label_smoothing: 0.1      # Prevents overconfidence (keep for calibration)

# Tversky loss (handles class imbalance via soft-F1, stable unlike dynamic pos_weight)
use_tversky: true
tversky_weight: 0.5        # Weight for Tversky regularizer (loss = BCE + 0.5*Tversky)
tversky_alpha: 0.3         # False positive penalty weight (lower = tolerate more FP)
tversky_beta: 0.7          # False negative penalty weight (higher = boost recall)
tversky_gamma: 1.0         # Focal modulation strength

max_tpl_cache: 1000
n_dist_bins: 8

# Distogram: predict distance bins, derive contact prob via softmax
distogram: true
cb_beta: 0.999  # Effective-number class balancing (Cui et al. 2019)

warmup_steps: 100
min_lr_ratio: 0.1

# SGDR warm restarts: exploration→exploitation with periodic LR resets
cosine_restarts: true
restart_period: 500     # T_0: first cycle length (steps). ~1.5-2 epochs
restart_mult: 2.0       # T_mult: each cycle 2x longer → 500, 1000, 2000, 4000, ...
restart_decay: 0.75     # Peak LR shrinks each cycle: 100%, 75%, 56%, 42%, ...

compile_model: true