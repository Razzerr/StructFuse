_target_: src.data.contact_lit_datamodule.ContactDataModule

# Root with NPZ files
data_root: ${paths.processed_dir}

# Override split files
train_ids: null
val_ids: ${paths.split_dir}/val_holdout_ids.txt
test_ids: ${paths.split_dir}/test_ids.txt

# Path to mmcif_final_splits.json for per-subset evaluation (gold, casp16, cluster_promoted)
splits_json_path: ${paths.split_dir}/mmcif_final_splits.json

# Subsets to exclude from test evaluation (saves time; set to [] for full test)
# NOTE: val_holdout_ids.txt and test_ids.txt already exclude cluster_promoted
test_exclude_subsets: []

val_ratio: 0.1               # only used when cluster_sampling=false (static split fallback)
split_dir: ${paths.split_dir}
split_seed: ${seed}

batch_size: 12
# Batch size for val/test only. null = same as batch_size (previous behaviour).
# Set to 1 for a padding-free evaluation: the model is padding-dependent
# (InstanceNorm2d over the full L x L map incl. padding, and axial attention
# without attn_mask), so a chain's prediction otherwise depends on which chains
# share its batch — which makes runs with different dataset composition
# incomparable. Does NOT touch the training batch or the effective batch after
# gradient accumulation.
eval_batch_size: null
num_workers: 8
bucketed: true

crop_size: 384
crop_mode: random     # random|center|none
min_seq_sep: 6
min_len: 20

# Cluster-aware train sampling: each epoch samples 1 chain per cluster.
# Val is always loaded from val_ids (static, from test-distribution holdout).
cluster_sampling: true
# Rotate the val sample composition (1 chain per multi-cluster) every epoch.
# Default false — pinning val to epoch=0 eliminates inter-epoch val-set noise
# so the trajectory reflects model improvement, not which chains were sampled.
# Train rotation is independent and unaffected.
rotate_val: false
index_dir: ${paths.index_t6}

# Retrieval / prior-building (PriorBuilder runs in DataLoader workers)
topk: 4
use_blosum: true
only_positive_transfer: false
min_template_similarity: 0.0
random_retrieval: false       # ablation: random templates instead of FAISS
random_seed: ${seed}          # seeds the random_retrieval RNG (stable per query)
max_tpl_cache: 5000

# Stage 2 — compute discretised Cα-Cα distance histograms (9 channels) in
# PriorBuilder. Default true because frontier and all current ablations
# either consume them (frontier, no_triangle) or simply ignore them
# (no_dist, no_templates) — cheap to compute, never wrong to have.
compute_dist_bins: true

# Holdout protein IDs (val + test). The FAISS index now INCLUDES these
# chains so val/test queries can retrieve meaningful templates at eval
# time; PriorBuilder filters them out at query-time during training so no
# train sample ever sees a val/test structure (leakage prevention).
# Set to null or [] to disable (e.g. if the index itself already excludes them).
holdout_id_files:
  - ${paths.split_dir}/val_holdout_ids.txt
  - ${paths.split_dir}/test_ids.txt

# Precomputed ESM2 embeddings (skip frozen ESM2 forward during training)
# Set to directory path after running: python scripts/precompute_esm2_embeddings.py
esm_embeddings_dir: ${paths.esm_t6}

# Skip-lists of chain stems, one stem per line (e.g. `8tz6_B`), filtered out of
# every dataset at setup time. Kept as separate files because the two reasons are
# audited separately:
#   corrupt_ids.txt    — known-corrupt NPZ (processed or precomputed ESM); the
#                        query side would crash on load.
#   no_cluster_ids.txt — no RCSB sequence-cluster assignment (written by
#                        scripts/resolve_chain_clusters.py). The same-cluster
#                        retrieval filter cannot check these in either direction,
#                        so they are excluded from the pipeline rather than
#                        special-cased at query time.
skip_ids_files:
  - data/corrupt_ids.txt
  - ${paths.split_dir}/no_cluster_ids.txt
# ── Evaluation cap (EVAL ONLY — training keeps the full redundancy) ──────────
# Chains inside one RCSB 30%-identity cluster are near-duplicates, so a mean
# taken over chains is a family-weighted average: the 2026 test set holds
# 165,412 chains from only 6,958 clusters, giving an effective sample size of
# 471 (0.3% of nominal) and confidence intervals ~19x too narrow. Metrics are
# therefore aggregated per cluster, and this cap bounds how many chains each
# cluster contributes.
#
# C=8 costs ~1.0% CI width versus evaluating every chain while using 21% of the
# compute; C=16 recovers 0.7pp for 47% more work, C=4 costs 3.3%. Full curve:
# `python scripts/cluster_composition.py`. See Methods 4.11.
#
# Applies to val and test datasets only — never to train/trainval. Set to null
# to evaluate every chain.
max_chains_per_cluster: 8
# Source of truth for chain -> cluster. NOT the FAISS ids.json: baselines
# without retrieval (B1, B3) are built with index_dir=null, and keying the cap
# off the index would evaluate them on a different subset than the retrieval
# models. Defaults to ${paths.split_dir}/chain_clusters.tsv when null.
chain_clusters_file: ${paths.split_dir}/chain_clusters.tsv
# Subsets evaluated in full regardless of the cap. CASP16 is tiny (42 entries)
# and the least redundant part of the benchmark, so it is never truncated.
cap_exempt_subsets:
  - casp16
