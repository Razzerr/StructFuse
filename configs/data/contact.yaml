_target_: src.data.contact_lit_datamodule.ContactDataModule

# Root with NPZ files
data_root: ${paths.processed_dir}

# Override split files
train_ids: null
val_ids: data/output_splits/val_holdout_ids.txt
test_ids: data/output_splits/test_ids.txt

# Path to mmcif_final_splits.json for per-subset evaluation (gold, casp16, cluster_promoted)
splits_json_path: data/output_splits/mmcif_final_splits.json

# Subsets to exclude from test evaluation (saves time; set to [] for full test)
# NOTE: val_holdout_ids.txt and test_ids.txt already exclude cluster_promoted
test_exclude_subsets: []

val_ratio: 0.1               # only used when cluster_sampling=false (static split fallback)
split_dir: ${paths.split_dir}
split_seed: ${seed}

batch_size: 12
num_workers: 8
bucketed: true

crop_size: 384
crop_mode: random     # random|center|none
min_seq_sep: 6
min_len: 20

# Cluster-aware train sampling: each epoch samples 1 chain per cluster.
# Val is always loaded from val_ids (static, from test-distribution holdout).
cluster_sampling: true
index_dir: data/index_t6

# Retrieval / prior-building (PriorBuilder runs in DataLoader workers)
topk: 4
use_blosum: true
only_positive_transfer: false
min_template_similarity: 0.0
random_retrieval: false       # ablation: random templates instead of FAISS
max_tpl_cache: 5000

# Holdout protein IDs (val + test). The FAISS index now INCLUDES these
# chains so val/test queries can retrieve meaningful templates at eval
# time; PriorBuilder filters them out at query-time during training so no
# train sample ever sees a val/test structure (leakage prevention).
# Set to null or [] to disable (e.g. if the index itself already excludes them).
holdout_id_files:
  - data/output_splits/val_holdout_ids.txt
  - data/output_splits/test_ids.txt

# Precomputed ESM2 embeddings (skip frozen ESM2 forward during training)
# Set to directory path after running: python scripts/precompute_esm2_embeddings.py
esm_embeddings_dir: data/precomputed/esm_t6_8M