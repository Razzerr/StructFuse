defaults:
  - model_checkpoint
  - early_stopping
  - model_summary
  - rich_progress_bar
  - ema
  - _self_

model_checkpoint:
  dirpath: ${paths.output_dir}/checkpoints
  filename: "epoch{epoch:02d}-f1long{val/f1_long:.3f}"
  monitor: "val/f1_long"
  mode: "max"
  save_last: True
  auto_insert_metric_name: False

early_stopping:
  monitor: "val/f1_long"
  patience: 5
  mode: "max"

model_summary:
  max_depth: -1
