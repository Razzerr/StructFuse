# @package _global_
# Stage 2 — add only template agreement (1 channel) on top of Stage 1.
# Tests whether cross-template consistency helps when top-K disagree.

defaults:
  - override /model: esm2_t33_650M

task_name: "stage2_agree_only"
tags: ["stage2", "features", "agree_only"]
seed: 42

model:
  fusion_strategy: "grouped"
  fusion_feature_groups:
    tpl_contact: 2
    tpl_agree: 1
  use_tpl_agreement: true

data:
  batch_size: 8
  index_dir: data/index_t33
  esm_embeddings_dir: data/precomputed/esm_t33_650M
  compute_agreement: true
