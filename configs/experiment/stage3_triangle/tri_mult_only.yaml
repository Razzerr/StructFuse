# @package _global_
# Stage 3 ablation — Stage 1 fusion + triangle blocks, WITHOUT Stage 2 features.
# Isolates whether triangle updates improve over axial alone.

defaults:
  - override /model: esm2_t33_650M

task_name: "stage3_tri_mult_only"
tags: ["stage3", "triangle", "ablation-tri-only"]
seed: 42

model:
  fusion_strategy: "grouped"
  fusion_feature_groups:
    tpl_contact: 2
  head_type: "axial_tri"
  triangle_c: 32
  lr: 3.0e-4
  warmup_steps: 1000
  use_checkpoint: true

data:
  batch_size: 8
  index_dir: data/index_t33
  esm_embeddings_dir: data/precomputed/esm_t33_650M
