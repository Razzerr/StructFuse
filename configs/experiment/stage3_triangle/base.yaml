# @package _global_
# Stage 3 frontier — Stage 2 all-features + triangle multiplicative update.
# 8 blocks interleaved: [ax, ax, tri_out, tri_in, ax, ax, tri_out, tri_in].
# Green light: P@L_long ep10 ≥ 0.60 (+4pp vs baseline 0.576).

defaults:
  - override /model: esm2_t33_650M

task_name: "stage3_base"
tags: ["stage3", "triangle", "frontier"]
seed: 42

model:
  fusion_strategy: "grouped"
  fusion_feature_groups:
    tpl_contact: 2
    tpl_dist: 9
    tpl_agree: 1
    tpl_dist_stats: 2
  use_tpl_dist_bins: true
  use_tpl_agreement: true
  use_tpl_dist_stats: true
  head_type: "axial_tri"
  triangle_c: 32
  # Stability tweaks for increased capacity (triangle blocks)
  lr: 3.0e-4
  warmup_steps: 1000
  use_checkpoint: true

data:
  batch_size: 8
  index_dir: data/index_t33
  esm_embeddings_dir: data/precomputed/esm_t33_650M
  compute_dist_bins: true
  compute_agreement: true
  compute_dist_stats: true
