# @package _global_
# Baseline B2 — ESM2-650M + trained head, NO templates.
# Fills the missing rung between (B1) ESM2-650M attention-only (no head, no training)
# and the frontier (650M + head + templates). Critical for paper paired-test:
# isolates "templates contribute" from "any trained head over 650M is enough".
#
# Identical to frontier.yaml EXCEPT: data.topk=0 (no retrieval), feature_groups
# minimal (tpl_contact-style features all zero anyway).

defaults:
  - override /model: esm2_t33_650M

task_name: "baseline_650m_trained_no_templates"
tags: ["baseline", "B2", "no-templates", "650M"]
seed: 42

model:
  fusion_strategy: "grouped"
  fusion_feature_groups:
    tpl_contact: 2          # encoder exists but receives zeros (data.topk=0)
  head_type: "axial_tri"
  triangle_c: 32
  lr: 3.0e-4
  warmup_steps: 1000
  use_checkpoint: true
  compile_model: false
  topk: 0                   # passive, mirrors data.topk for config-log clarity

data:
  batch_size: 8
  index_dir: data/index_t33
  esm_embeddings_dir: data/precomputed/esm_t33_650M
  compute_dist_bins: false  # no templates → no point computing dist features
  topk: 0                   # ← real switch: PriorBuilder skips FAISS entirely

trainer:
  deterministic: true
