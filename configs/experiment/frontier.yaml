# @package _global_
# Canonical frontier config — headline 650M Stage 3 model.
# Architecture comes entirely from configs/model/esm2_t33_650M.yaml
# (grouped fusion + tpl_contact + tpl_dist + axial_tri + triangle).
# This file just pins task_name, seed and data paths.
#
# Headline runs (3 seeds): launch with seed=0, seed=42, seed=1337 separately.
# Default seed=42 here so single-launch matches Stage 3 prior runs.

defaults:
  - override /model: esm2_t33_650M

task_name: "frontier"
tags: ["frontier", "stage3", "headline", "650M"]
seed: 42

model:
  # 650M needs gradient checkpointing — model default is already true,
  # kept here explicit so the headline pin is self-documenting.
  use_checkpoint: true

data:
  batch_size: 8
  index_dir: data/index_t33
  esm_embeddings_dir: data/precomputed/esm_t33_650M

# Bit-reproducibility for headline seeds: pass `+trainer.deterministic=true`
# from CLI. Avoid bare `trainer:` block here — Hydra `@package _global_`
# replaces the whole group instead of merging (strips trainer/gpu defaults).
