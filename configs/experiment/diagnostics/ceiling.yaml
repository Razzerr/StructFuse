# @package _global_
# Stage 0 diagnostic: ceiling analysis — how much P@L_long do raw features
# (prior, esm_contacts) and linear combinations give us WITHOUT any learned
# pair head? Run via:
#
#   python scripts/ceiling.py experiment=diagnostics/ceiling
#
# Uses the same data pipeline as training so the numbers are directly
# comparable to val/P@L_long during training. Enables tpl_dist_bins so the
# logistic-regression ceiling can include the kept Stage 2 feature.

defaults:
  - override /model: esm2_t33_650M

task_name: "ceiling"
tags: ["diagnostics", "ceiling"]
seed: 42

data:
  batch_size: 8
  index_dir: data/index_t33
  esm_embeddings_dir: data/precomputed/esm_t33_650M
  compute_dist_bins: true

# We don't train here; just push val batches through the pipeline.
train: false
test: false

ceiling:
  # -1 = full val set. 100 batches (~800 samples) is already tight on ceiling
  # estimate noise; use that as default so the job fits inside 1h wall time.
  max_batches: 100
  # Per-batch balanced subsample for logistic regression fitting.
  max_pairs_per_batch: 20000
  out_path: .temp/ceiling_results.tsv

# scripts/feature_correlation.py — reads this block.
correlation:
  max_batches: 200
  max_pairs: 1000000
  out_path: .temp/feature_correlation.tsv
