# @package _global_
# 8M version of frontier — used as Phase 0.5 scout (S0a) and as ablation
# baseline for Phases 2-3 (paired Wilcoxon vs ablations is computed against
# THIS run, not the 650M frontier, so the backbone matches).
#
# Validates: pipeline end-to-end on 8M (cheap), per-protein dump correct,
# audit auto-dump fires, ordinal direction S1<S2<S3 reproducible at 8M
# (sanity for using 8M as ablation proxy).

defaults:
  - override /model: esm2_t6_8M

task_name: "frontier_8M"
tags: ["frontier", "stage3", "triangle", "dist_only", "8M", "ablation_reference"]
seed: 42

model:
  fusion_strategy: "grouped"
  fusion_feature_groups:
    tpl_contact: 2
    tpl_dist: 9
  use_tpl_dist_bins: true
  head_type: "axial_tri"
  triangle_c: 32
  lr: 3.0e-4
  warmup_fraction: 0.05
  use_checkpoint: false
  # See frontier.yaml — torch.compile bug on triangle path. Cost ~20-30%.
  compile_model: false

data:
  batch_size: 12          # 8M has more headroom than 650M
  index_dir: data/index_t6
  esm_embeddings_dir: data/precomputed/esm_t6_8M
  compute_dist_bins: true

# NOTE: deterministic mode is NOT set here — Hydra `@package _global_` interprets a
# single-field `trainer:` block as a full replacement, stripping defaults from
# trainer/gpu (limit_train_batches etc.). Pass `+trainer.deterministic=true` from
# CLI when bit-reproducibility is required (smoke_repro_test handles this).
