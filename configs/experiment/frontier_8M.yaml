# @package _global_
# 8M version of frontier — Phase 0.5 scout (S0a) and the baseline against
# which Phase 2-3 ablations on 8M are paired (paired Wilcoxon vs THIS run).
# Architecture comes entirely from configs/model/esm2_t6_8M.yaml.

defaults:
  - override /model: esm2_t6_8M

task_name: "frontier_8M"
tags: ["frontier", "stage3", "8M", "ablation_reference"]
seed: 42

data:
  batch_size: 12          # 8M has more headroom than 650M
  index_dir: data/index_t6
  esm_embeddings_dir: data/precomputed/esm_t6_8M

# See frontier.yaml note on `trainer:` block — use CLI `+trainer.foo=bar`.
