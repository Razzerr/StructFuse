# @package _global_
# ABLATION: No template retrieval - pure ESM2 baseline
# This isolates the contribution of ESM2 embeddings alone.
# IMPORTANT: PriorBuilder lives in ContactDataModule (DataLoader workers),
# so the override MUST hit data.topk — model.topk alone does nothing.

task_name: "ablation_no_templates"
tags: ["ablation", "no-templates"]
seed: 42

data:
  topk: 0
  compute_dist_bins: false

model:
  topk: 0
  use_template_features: false
  use_tpl_dist_bins: false
