# @package _global_
# ABLATION (A1): historical standard-fusion stack without distance bins.
#
# Retained unchanged for the completed paper run and for measuring the
# within-strategy value of distance bins. It is not an equal-input comparison
# with the grouped frontier because it intentionally disables tpl_dist_bins.
# Use ablation/standard_fusion_with_dist for the clean full-input comparison.

task_name: "ablation_standard_fusion"
tags: ["ablation", "A1", "standard-fusion", "confounded"]
seed: 42

model:
  fusion_strategy: "standard"
  fusion_feature_groups: null
  use_tpl_dist_bins: false
