# @package _global_
# ABLATION: BCE-only loss (no Tversky regularizer).
# Defends the BCE+Tversky design choice in paper.
#
# Stack on top of frontier (S3 dist_tri):
#   python src/train.py experiment=stage3_triangle/dist_tri \
#                       +experiment=ablation/bce_only

task_name: "ablation_bce_only"
tags: ["ablation", "bce-only", "no-tversky"]
seed: 42

model:
  use_tversky: false
  tversky_weight: 0.0
