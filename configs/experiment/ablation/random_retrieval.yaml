# @package _global_
# ABLATION: Random template retrieval (killer ablation)
# If StructFuse needs semantically similar templates, random should fail.
# IMPORTANT: PriorBuilder lives in ContactDataModule (DataLoader workers),
# so the override MUST hit data.random_retrieval — model.random_retrieval alone does nothing.

task_name: "ablation_random_retrieval"
tags: ["ablation", "random-retrieval"]
seed: 42

data:
  random_retrieval: true

model:
  random_retrieval: true