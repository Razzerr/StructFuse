# @package _global_
# ABLATION: Axial attention head WITHOUT triangle multiplicative updates.
# Isolates the contribution of triangle-mult. Required to defend Stage 3 in paper:
# guideline says "triangle ablation must show positive contribution vs axial-only".
#
# Stack on top of frontier (S3 dist_tri):
#   python src/train.py experiment=stage3_triangle/dist_tri \
#                       +experiment=ablation/axial_only
# With triangle gone, the torch.compile + triangle einsum + bf16 bug no longer applies,
# so `compile_model` can be flipped back to true for ~20-30% speedup.

task_name: "ablation_axial_only"
tags: ["ablation", "axial-only", "no-triangle"]
seed: 42

model:
  head_type: "axial"
  compile_model: true
