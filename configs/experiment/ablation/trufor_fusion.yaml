# @package _global_
# ABLATION (A2): historical TruFor-style fusion stack without distance bins.
#
# Retained unchanged for the completed paper run and for measuring the
# within-strategy value of distance bins. It is not an equal-input comparison
# with the grouped frontier because it intentionally disables tpl_dist_bins.
# Use ablation/trufor_fusion_with_dist for the clean full-input comparison.

task_name: "ablation_trufor_fusion"
tags: ["ablation", "A2", "trufor", "no-grouped", "confounded"]
seed: 42

model:
  fusion_strategy: "trufor"
  fusion_feature_groups: null
  use_tpl_dist_bins: false

# data.compute_dist_bins stays true (default) so data loading remains matched.
