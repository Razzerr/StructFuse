# @package _global_
# ABLATION (A2): TruFor cross-attention fusion instead of grouped.
#
# CAVEAT — this is NOT a pure fusion change. TruFor's branch in
# pair2d_head.py:425 doesn't accept tpl_dist_bins (only GroupedFeatureFusion
# does), so this ablation simultaneously (a) swaps fusion grouped→trufor
# and (b) drops explicit consumption of the 9-channel distance histogram.
# Interpret as "full TruFor stack vs frontier", not "isolated fusion delta".

task_name: "ablation_trufor_fusion"
tags: ["ablation", "A2", "trufor", "no-grouped", "confounded"]
seed: 42

model:
  fusion_strategy: "trufor"
  fusion_feature_groups: null  # TruFor does not use grouped feature_groups
  use_tpl_dist_bins: false     # TruFor branch doesn't consume tpl_dist_bins

# data.compute_dist_bins stays true (default) — cheap, and lets paired
# Wilcoxon use exact same val/test batches as frontier_8M.
