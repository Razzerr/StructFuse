# @package _global_
# Stage 4 risk comparison — lambda_disto=0.6 (2× default in base.yaml).
# Inherits the same architecture as base.yaml (Stage 3 dist_tri + disto aux).
# Stress test: does stronger aux signal start competing with BCE for
# capacity? If P@L_long regresses vs base (λ=0.3), revert to base. If
# both base and high regress, drop the disto head entirely.
# Run order: launch base.yaml FIRST; only run lambda_high after base
# proves green (ep26 P@L_long ≥ 0.770).

defaults:
  - override /model: esm2_t33_650M

task_name: "stage4_lambda_high"
tags: ["stage4", "distogram", "lambda-high", "dist_only"]
seed: 42

model:
  # ↓↓↓ identical to base.yaml / stage3_triangle/dist_tri
  fusion_strategy: "grouped"
  fusion_feature_groups:
    tpl_contact: 2
    tpl_dist: 9
  use_tpl_dist_bins: true
  head_type: "axial_tri"
  triangle_c: 32
  lr: 3.0e-4
  warmup_fraction: 0.05
  use_checkpoint: true
  compile_model: false   # triangle + checkpoint + bf16 ↯ torch.compile AOT
  # ↑↑↑ shared frontier
  use_distogram_head: true
  n_distogram_bins: 8
  lambda_disto: 0.6      # ← only difference vs base.yaml (2× base λ=0.3)

data:
  batch_size: 8
  index_dir: data/index_t33
  esm_embeddings_dir: data/precomputed/esm_t33_650M
  compute_dist_bins: true
  compute_gt_dist_bins: true
