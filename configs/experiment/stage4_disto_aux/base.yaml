# @package _global_
# Stage 4 frontier — direct continuation of Stage 3 `dist_tri` (z7wjktw1
# peak P@L_long = 0.7605 ep26). Adds distogram auxiliary head & loss
# (λ=0.3, AF2-like): second head predicts 8-bin Cα-Cα distance
# distribution alongside primary contact BCE.
#
# λ raised from 0.05 → 0.3 after `1tsf4vgs` showed neutral result: the
# /log(C) normalization in masked_ce_distogram pushed disto loss to ~0.02
# vs BCE 0.27, so λ=0.05 contributed only ~0.3% of total loss → no
# representational pressure. Fix (2026-04-28): removed /log(C); λ=0.3
# matches AF2 distogram aux-loss weighting on raw natural-log CE scale.
#
# Green light: ep26 P@L_long ≥ 0.770 (+1pp over Stage 3) AND
# val/loss_disto monotonically decreasing.
#
# NOTE: tpl_agreement & tpl_dist_stats were KILLED in Stage 2 ablations
# (memory-decisions 2026-04-20). Stage 4 inherits dist_only feature set.

defaults:
  - override /model: esm2_t33_650M

task_name: "stage4_disto_aux"
tags: ["stage4", "distogram", "aux-loss", "frontier", "dist_only"]
seed: 42

model:
  # ↓↓↓ identical to stage3_triangle/dist_tri — keep in sync
  fusion_strategy: "grouped"
  fusion_feature_groups:
    tpl_contact: 2
    tpl_dist: 9
  use_tpl_dist_bins: true
  head_type: "axial_tri"
  triangle_c: 32
  lr: 3.0e-4
  warmup_fraction: 0.05
  use_checkpoint: true
  # torch.compile inductor backend fails on triangle einsum + gradient
  # checkpointing + bf16 (AOT partitioner "invalid output node").
  compile_model: false
  # ↑↑↑ Stage 3 inheritance ends here
  # ↓↓↓ Stage 4 additions
  use_distogram_head: true
  n_distogram_bins: 8
  lambda_disto: 0.3

data:
  batch_size: 8
  index_dir: data/index_t33
  esm_embeddings_dir: data/precomputed/esm_t33_650M
  compute_dist_bins: true
  compute_gt_dist_bins: true   # GT distogram targets for aux CE loss
