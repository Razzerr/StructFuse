# @package _global_
# Stage 4 frontier — Stage 3 + distogram auxiliary head & loss (λ=0.05).
# Multi-task regularization: second head predicts 8-bin Cα-Cα distance
# distribution alongside primary contact BCE. Aux is *light* by design —
# BCE stays the optimization target.

defaults:
  - override /model: esm2_t33_650M

task_name: "stage4_base"
tags: ["stage4", "distogram", "aux-loss", "frontier"]
seed: 42

model:
  fusion_strategy: "grouped"
  fusion_feature_groups:
    tpl_contact: 2
    tpl_dist: 9
    tpl_agree: 1
    tpl_dist_stats: 2
  use_tpl_dist_bins: true
  use_tpl_agreement: true
  use_tpl_dist_stats: true
  head_type: "axial_tri"
  triangle_c: 32
  lr: 3.0e-4
  warmup_steps: 1000
  use_checkpoint: true
  # Distogram aux
  use_distogram_head: true
  n_distogram_bins: 8
  lambda_disto: 0.05

data:
  batch_size: 8
  index_dir: data/index_t33
  esm_embeddings_dir: data/precomputed/esm_t33_650M
  compute_dist_bins: true
  compute_agreement: true
  compute_dist_stats: true
  compute_gt_dist_bins: true
