# @package _global_
# Seed-42 650M candidate using standard fusion with the complete template
# feature set. Launch only after reviewing the corresponding 8M parity run.

defaults:
  - override /model: esm2_t33_650M

task_name: "standard_fusion_with_dist_650M"
tags: ["candidate", "fusion-parity", "standard-fusion", "tpl-dist", "650M"]
seed: 42

model:
  fusion_strategy: "standard"
  use_tpl_dist_bins: true
  use_checkpoint: true

data:
  batch_size: 8
  index_dir: ${paths.index_t33}
  esm_embeddings_dir: ${paths.esm_t33}
  compute_dist_bins: true
