# @package _global_
#
# Training hygiene fix — CONTROL experiment (no late fusion):
# Same fixes as late_fusion.yaml but with standard early fusion (prior+count in TruForFusion).
# This isolates the effect of training fixes from the late fusion change.
#
# Changes vs baseline (nv71943g):
# 1. BCE-only: drop Tversky (gradient conflict: Tversky↓ while BCE↑)
# 2. Lower LR: 5e-4 → 1e-4, warmup 100 → 400
# 3. Full data: limit_train_batches removed (was 0.1)
# 4. pos_weight=5: compensate class imbalance without Tversky

defaults:
  - override /model: esm2_t33_650M
  - override /logger: wandb

task_name: "training_fix_control"

tags: ["bce", "no-tversky", "full-data", "control"]
seed: 42

data:
  batch_size: 8
  index_dir: data/index_t33
  esm_embeddings_dir: data/precomputed/esm_t33_650M

trainer:
  limit_train_batches: null  # use ALL training data

model:
  distogram: false
  cb_beta: 0.0
  n_dist_bins: 0
  n_ss_feat: 0

  # Loss: BCE-only, no Tversky
  use_tversky: false
  pos_weight_scale: 5.0
  label_smoothing: 0.05

  # Lower LR + longer warmup
  lr: 1.0e-4
  warmup_steps: 400

  # Diagnostics
  diagnostic_logging: true
  diag_every: 25
