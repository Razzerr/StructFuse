# @package _global_

defaults:
  - override /model: esm2_only

task_name: "esm2_8m_only"

tags: ["baseline", "esm-only"]
seed: 42

train: false
test: true

trainer:
  max_epochs: 1
  limit_train_batches: 0

model:
  esm_model: esm2_t6_8M_UR50D

data:
  batch_size: 32
  bucketed: false  # No bucketing for cleaner evaluation
  # B3 is attention-only (ESM2OnlyLitModule computes contacts online and ignores
  # retrieval + cached ESM) — make it self-contained so no PriorBuilder runs.
  topk: 0
  index_dir: null
  esm_embeddings_dir: null
  compute_dist_bins: false
