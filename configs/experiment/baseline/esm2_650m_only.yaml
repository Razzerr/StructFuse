# @package _global_

defaults:
  - override /model: esm2_only

task_name: "esm2_only"

tags: ["contact-pred", "esm2-only-baseline", "no-templates", "frozen"]
seed: 42

train: false
test: true

trainer:
  max_epochs: 1
  limit_train_batches: 0

model:
  esm_model: esm2_t33_650M_UR50D

data:
  batch_size: 16
  bucketed: false  # No bucketing for cleaner evaluation
