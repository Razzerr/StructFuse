# @package _global_

defaults:
  - override /model: esm2_only

task_name: "esm2_650m_only"

tags: ["baseline", "esm-only", "650m"]
seed: 42

train: false
test: true

trainer:
  max_epochs: 1
  limit_train_batches: 0

model:
  esm_model: esm2_t33_650M_UR50D

# Self-contained: ESM2OnlyLitModule runs its own 650M forward from
# model.esm_model and ignores cached ESM fields, so precomputed embeddings are
# unused → null. No templates → topk=0 (no PriorBuilder) and index_dir=null.
data:
  batch_size: 16
  bucketed: false  # No bucketing for cleaner evaluation
  topk: 0
  index_dir: null
  esm_embeddings_dir: null
  compute_dist_bins: false
