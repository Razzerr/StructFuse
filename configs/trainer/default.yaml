_target_: lightning.pytorch.trainer.Trainer

default_root_dir: ${paths.output_dir}

min_epochs: 1 # prevents early stopping
max_epochs: 50

accelerator: gpu
devices: 1

accumulate_grad_batches: 4

# mixed precision for extra speed-up
# bf16 has the same exponent range as fp32 (no overflow), H100 has native bf16 support
precision: bf16-mixed

# gradient clipping for training stability
gradient_clip_val: 1.0
gradient_clip_algorithm: norm

# perform a validation loop every N training epochs
check_val_every_n_epoch: 1

# re-create dataloaders each epoch so ClusterTrainValSampler
# draws fresh train/val splits from each cluster
reload_dataloaders_every_n_epochs: 1

# Deterministic by default — bit-reproducibility for paper runs (3-seed H1
# mean±std, paired Wilcoxon need stable per-sample numbers). Costs some speed.
# NOTE: if a CUDA op lacks a deterministic kernel, Lightning raises at step 0
# with True; fall back per-run with `trainer.deterministic=warn` (warns instead
# of crashing — loses strict bit-identity but keeps the run alive). Disable with
# `trainer.deterministic=false`.
deterministic: True

# Use full training set by default. Override via CLI for smoke tests
# (e.g. `++trainer.limit_train_batches=0.005`).
limit_train_batches: 1.0
